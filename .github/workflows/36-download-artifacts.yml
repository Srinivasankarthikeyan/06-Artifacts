name: 36 - Download Artifacts
# This workflow shows how to download artifacts from a previous job or workflow run.
# Exam Tip: 'actions/download-artifact' downloads artifacts by name.

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Data to persist" > data.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared-data
          path: data.txt

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-data
          # Directory to download into (defaults to current workspace)
          path: downloaded-files
      
      - name: Verify download
        run: cat downloaded-files/data.txt
